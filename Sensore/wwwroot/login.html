<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Sensore – Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #e5e7eb 0, #d1d5db 40%, #e5e7eb 100%);
        }
        .card {
            background: #ffffff;
            padding: 24px 26px;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(148,163,184,0.6);
            border: 1px solid #e5e7eb;
            width: 320px;
        }
        h1 {
            margin: 0 0 16px;
            font-size: 22px;
        }
        label {
            font-size: 13px;
            color: #6b7280;
            display: block;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            margin-bottom: 12px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 9px 0;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #38bdf8);
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        #status {
            margin-top: 8px;
            font-size: 13px;
            color: #6b7280;
            min-height: 18px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Sign in</h1>
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="user1, user2, admin" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="demo123 or admin123" />
    <button id="loginBtn">Login</button>
    <div id="status"></div>
</div>

<script>
    const apiBase = 'http://localhost:5076';

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const status = document.getElementById('status');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        status.textContent = 'Signing in…';

        try {
            const res = await fetch(`${apiBase}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
                credentials: 'include'
            });

            if (!res.ok) {
                status.textContent = 'Invalid credentials.';
                return;
            }

            const data = await res.json();
            if (data.role === 'Admin') {
                window.location.href = '/heatmap.html';
            } else {
                window.location.href = '/user-heatmap.html';
            }
        } catch (e) {
            status.textContent = 'Error: ' + e.message;
        }
    });
</script>
</body>
</html>
